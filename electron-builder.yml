appId: com.deca.wrong-answer-app
productName: 小乖的考公错题屋
directories:
  buildResources: resources
  output: dist
files:
  - out/**/*
  - package.json
  - node_modules/**/*
asarUnpack:
  - "**/*.node"
mac:
  target:
    - dmg
  category: public.app-category.education
  icon: resources/icon.png
  identity: "Deca Dev Cert"
dmg:
  title: 小乖的考公错题屋
win:
  target:
    - nsis
  icon: resources/icon.png
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
linux:
  target:
    - AppImage
  category: Education
