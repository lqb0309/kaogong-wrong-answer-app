[package]
name = "wrong-answer-tauri-desktop"
version = "0.3.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-notification = "2"
serde_json = "1"
futures-channel = "0.3"
base64 = "0.22"
png = "0.17"
getrandom = "0.3"
lopdf = "0.38"
tokio = { version = "1", features = ["time", "sync"] }

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3"
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-web-kit = "0.3"
objc2-app-kit = "0.3"
objc2-core-foundation = "0.3"
block2 = "0.6"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
